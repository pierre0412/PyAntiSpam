server:
    # Pas de port publié vers l'hôte dans docker-compose.yml : seul rspamd,
    # sur le même réseau docker, peut interroger ce résolveur.
    interface: 0.0.0.0
    access-control: 172.16.0.0/12 allow

    # DNSSEC et root hints sont déjà configurés par défaut dans l'image
    # klutchell/unbound. On ne redéfinit que ce qui est spécifique à l'usage
    # anti-DNSBL de rspamd.
    #
    # Rappel (voir doc projet) : les listes noires DNS (Spamhaus, URIBL...)
    # refusent les résolveurs publics. Codes à NE PAS confondre avec "listé" :
    #   127.255.255.254 -> Spamhaus a détecté un résolveur public, refusé
    #   127.0.0.1       -> URIBL, requête refusée
    # Avec unbound en résolveur récursif local, ces deux cas ne devraient plus
    # se produire.

    # Cache un peu plus généreux : rspamd interroge beaucoup les mêmes zones
    # DNSBL/SPF/DKIM pour des domaines récurrents.
    cache-min-ttl: 300
    msg-cache-size: 16m
    rrset-cache-size: 32m
